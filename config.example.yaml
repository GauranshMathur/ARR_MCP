# ARR-MCP configuration.
#
# Copy to config.yaml and edit, then run with --config config.yaml (or set
# ARR_MCP_CONFIG to its path). You only need this file to run more than one
# instance of a service, or to set per-instance permissions — a single Sonarr,
# Radarr, Prowlarr and Bazarr can be configured entirely from <SERVICE>_URL and
# <SERVICE>_API_KEY environment variables with no file at all.
#
# This file supersedes those environment variables rather than merging with
# them: once --config is passed, every instance comes from here.
#
# Secrets should stay in environment variables and be referenced as ${VAR} so
# this file is safe to commit or mount from a ConfigMap. An unset or empty
# variable is a startup error, never a silent empty value.

server:
  # stdio for desktop MCP clients, http for a shared/in-cluster deployment.
  # Command-line flags override everything in this block.
  transport: stdio
  addr: 0.0.0.0:8080
  logLevel: info

permissions:
  # readonly - only read tools are exposed at all
  # confirm  - mutating tools ask the user before running (default)
  # full     - everything runs immediately
  mode: confirm
  # Which tiers require confirmation under `confirm`: write (includes
  # destructive) or destructive (deletes only).
  confirmScope: write
  # What to do when the MCP client cannot prompt the user. `deny` fails closed,
  # so a client lacking elicitation support never gets silent write access.
  # Set `allow` only deliberately: it turns `confirm` into `full` for any such
  # client.
  fallback: deny

# Supported services: sonarr, radarr, prowlarr, bazarr. Anything else is
# rejected at startup rather than ignored, so a typo is caught immediately.
#
# Instance names must be unique within a service and are advertised to the model
# as a schema enum, so it picks from a closed set. At most one instance per
# service may be `default`; a tool call that omits `instance` uses it. With
# several instances and no default, such a call fails with a message listing the
# valid names rather than guessing.
services:
  sonarr:
    - name: main
      url: http://192.168.10.12:8989
      apiKey: ${SONARR_MAIN_API_KEY}
      default: true
    - name: anime
      url: http://192.168.10.13:8989
      apiKey: ${SONARR_ANIME_API_KEY}
      # Per-instance override: this instance refuses all mutations regardless
      # of the global mode above.
      permissions:
        mode: readonly

  radarr:
    - name: main
      url: http://192.168.10.14:7878
      apiKey: ${RADARR_MAIN_API_KEY}
      default: true
    - name: 4k
      url: http://192.168.10.15:7878
      apiKey: ${RADARR_4K_API_KEY}

  prowlarr:
    - name: main
      url: http://192.168.10.18:9696
      apiKey: ${PROWLARR_API_KEY}

  # Bazarr often runs doubled, one per Sonarr/Radarr pair.
  bazarr:
    - name: tv
      url: http://192.168.10.16:6767
      apiKey: ${BAZARR_TV_API_KEY}
      default: true
    - name: movies
      url: http://192.168.10.17:6767
      apiKey: ${BAZARR_MOVIES_API_KEY}
