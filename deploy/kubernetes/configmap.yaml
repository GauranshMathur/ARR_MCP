# Non-secret configuration. Only API keys and passwords live in the Secret;
# everything here is safe to commit, which is the point of the ${VAR} references.
#
# Service URLs must be resolvable FROM THIS POD. Use in-cluster DNS
# (http://sonarr.media.svc.cluster.local:8989) when the *arr apps run in the
# same cluster, or their LAN address when they do not. Never localhost: in a
# pod that means the pod itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-mcp
  namespace: media
data:
  config.yaml: |
    server:
      transport: http
      addr: 0.0.0.0:8080
      logLevel: info

    permissions:
      # Most MCP clients reaching a shared in-cluster server cannot prompt the
      # user, and `fallback: deny` then refuses every write. That is the correct
      # default, but it means a shared deployment is effectively read-only
      # unless you decide otherwise here.
      mode: confirm
      confirmScope: write
      fallback: deny

    services:
      sonarr:
        - name: main
          url: http://sonarr.media.svc.cluster.local:8989
          apiKey: ${SONARR_MAIN_API_KEY}
          default: true
        - name: anime
          url: http://sonarr-anime.media.svc.cluster.local:8989
          apiKey: ${SONARR_ANIME_API_KEY}

      radarr:
        - name: main
          url: http://radarr.media.svc.cluster.local:7878
          apiKey: ${RADARR_MAIN_API_KEY}
          default: true

      prowlarr:
        - name: main
          url: http://prowlarr.media.svc.cluster.local:9696
          apiKey: ${PROWLARR_API_KEY}

      bazarr:
        - name: tv
          url: http://bazarr.media.svc.cluster.local:6767
          apiKey: ${BAZARR_TV_API_KEY}
          default: true

      # Download clients authenticate with a username and password.
      qbittorrent:
        - name: main
          url: http://qbittorrent.media.svc.cluster.local:8080
          username: admin
          password: ${QBITTORRENT_PASSWORD}

      nzbget:
        - name: main
          url: http://nzbget.media.svc.cluster.local:6789
          username: nzbget
          password: ${NZBGET_PASSWORD}

      # Maintainerr has no authentication, so it needs no secret.
      maintainerr:
        - name: main
          url: http://maintainerr.media.svc.cluster.local:6246

      seerr:
        - name: main
          url: http://seerr.media.svc.cluster.local:5055
          apiKey: ${SEERR_API_KEY}

      # Jellyfin takes an API key (Dashboard -> API Keys). The Service lives in
      # its own namespace, so the address is not under .media.
      jellyfin:
        - name: main
          url: http://jellyfin.jelly.svc.cluster.local:8096
          apiKey: ${JELLYFIN_API_KEY}

      # Jellystat takes an API key (Settings -> API Keys), sent as X-Api-Token.
      jellystat:
        - name: main
          url: http://jellystat.jelly.svc.cluster.local:3000
          apiKey: ${JELLYSTAT_API_KEY}

      # Synology DSM. The account must be a NAS administrator, so
      # its password is full control of the NAS. Plain HTTP on port 5000: the
      # password crosses the network unencrypted, so the cluster and the NAS must
      # share a trusted LAN.
      synology:
        - name: main
          url: http://192.168.10.30:5000
          username: your-dsm-admin
          password: ${SYNOLOGY_PASSWORD}
          # Folders the file-changing tools may touch; unset or empty refuses them
          # all. The account is a NAS administrator, so this is the ONLY limit.
          # allowedPaths: ["/NAS"]
