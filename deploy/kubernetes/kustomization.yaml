apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # secret.yaml is intentionally absent: copy secret.example.yaml, or generate
  # the Secret with Sealed Secrets / External Secrets and add it here.
  # ingressroute.yaml is opt-in; see the warning inside it.

images:
  - name: ghcr.io/gauranshmathur/arr-mcp
    newTag: latest
