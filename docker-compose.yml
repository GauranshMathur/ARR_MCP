services:
  arr-mcp:
    image: ghcr.io/gauranshmathur/arr-mcp:latest
    container_name: arr-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Multi-instance setup: mount a config file and point at it.
    #   volumes:
    #     - ./config.yaml:/etc/arr-mcp/config.yaml:ro
    #   command: ["--transport", "http", "--addr", "0.0.0.0:8080",
    #             "--config", "/etc/arr-mcp/config.yaml"]
    #
    # Single-instance setup: no config file, values come from .env.
    command: ["--transport", "http", "--addr", "0.0.0.0:8080"]
    healthcheck:
      # The distroless image has no shell or curl, so probe from the host side
      # or use the binary's own connectivity check.
      test: ["CMD", "/usr/local/bin/arr-mcp", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
